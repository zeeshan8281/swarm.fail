name: score submission
on:
  pull_request_target:
    paths: ["submissions/**"]

# pull_request_target runs in the BASE repo context (trusted scorer + write
# token). We only overlay the PR's submissions/ (data + policy TEXT) and run the
# base scorer, which runs the policy inside a vm sandbox — untrusted code never
# executes with the token.
permissions:
  contents: write
  pull-requests: write

concurrency: score-pr-${{ github.event.pull_request.number }}

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      # full history: data/landed.json is refreshed from the add-commit of each
      # submission, and a shallow clone makes those dates wrong, not missing
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      - name: Overlay the PR's submissions
        run: |
          git fetch origin "pull/${{ github.event.pull_request.number }}/head:prhead"
          git checkout prhead -- submissions

      - name: Find the changed submission
        id: find
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base="$BASE"
          # A PR that also changes the engine/scorer can't be scored here: this job
          # deliberately runs the BASE scorer, so the policy would be judged against
          # an engine it wasn't written for (and would look broken when it isn't).
          if git diff --name-only "$base" prhead -- lib scripts bin | grep -q .; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "msg=⚙️ This PR changes the engine or scorer as well as a submission, so CI can't score it — the scorer runs base-repo code by design. Score it locally with \`node bin/swarm.mjs board\` and merge by hand." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          touched=$(git diff --name-only "$base" prhead -- 'submissions/*.js' | grep -v 'submissions/example.js' || true)
          echo "touched: $touched"
          # A copy sweep over the `// @note` headers is not a submission. Only count
          # files whose actual code moved, so wording changes don't get scored (or
          # rejected for touching more than one policy).
          files=$([ -n "$touched" ] && node scripts/code-changed.mjs "$base" prhead $touched || true)
          n=$(printf '%s\n' "$files" | grep -c . || true)
          echo "code-changed ($n): $files"
          if [ -n "$touched" ] && [ "$n" = "0" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "msg=💬 No policy code changed here — only comments — so there's nothing to score." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$n" != "1" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "msg=❌ A submission PR must add exactly one \`submissions/<handle>.js\` (found $n)." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          handle=$(basename "$files" .js)
          # This value comes from a file name in an untrusted fork PR and is used
          # in later steps. Anything but a plain handle is rejected outright.
          case "$handle" in
            *[!A-Za-z0-9._-]* | "" | .* )
              echo "ok=false" >> "$GITHUB_OUTPUT"
              echo "msg=❌ Submission file names must be plain — letters, digits, dot, dash, underscore." >> "$GITHUB_OUTPUT"
              exit 0 ;;
          esac
          # Auto-merge lands the WHOLE pull request, not just the policy. A PR
          # that beat the record while also carrying .github/workflows/*, or a
          # package.json with a postinstall, would put attacker code on main —
          # where it runs with the repo's secrets and the deploy credentials.
          # Score anything, but only ever merge a pull request that is nothing
          # but submissions/.
          outside=$(git diff --name-only "$base" prhead | grep -v '^submissions/' || true)
          if [ -n "$outside" ]; then
            echo "outside submissions/: $outside"
            echo "mergeable=false" >> "$GITHUB_OUTPUT"
          else
            echo "mergeable=true" >> "$GITHUB_OUTPUT"
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
          echo "handle=$handle" >> "$GITHUB_OUTPUT"

      - name: Score + comment + maybe merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          OK: ${{ steps.find.outputs.ok }}
          MSG: ${{ steps.find.outputs.msg }}
          HANDLE: ${{ steps.find.outputs.handle }}
          MERGEABLE: ${{ steps.find.outputs.mergeable }}
        run: |
          if [ "$OK" != "true" ]; then
            gh pr comment "$PR" --body "$MSG"
            exit 0
          fi
          node scripts/score-submissions.mjs --check "$HANDLE" > result.json
          cat result.json
          node -e '
            const r=require("./result.json"), fs=require("fs");
            const mergeable=process.env.MERGEABLE==="true";
            let body, merge=false;
            if(r.error) body="❌ **"+r.handle+"** could not be scored: `"+r.error+"`";
            else if(!r.ok) body="❌ **"+r.handle+"** — FAIL: the swarm did not explore every map. score `"+r.score+"`.";
            else if(r.beats && !mergeable) body="🏆 **"+r.handle+"** scores **"+r.score+"** — beats the current best `"+r.best+"`. Not auto-merging: this pull request also changes files outside `submissions/`, and auto-merge would land those on `main` too. Split the policy into its own PR and it lands itself.";
            else if(r.beats){ body="✅ **"+r.handle+"** scores **"+r.score+"** — beats the current best `"+r.best+"` (floor "+r.floor+"). Auto-merging 🎉"; merge=true; }
            else body="🟡 **"+r.handle+"** scores **"+r.score+"**, but the current best is `"+r.best+"`. Beat it to auto-merge.";
            fs.writeFileSync("body.md",body); fs.writeFileSync("merge.txt",merge?"1":"0");
          '
          gh pr comment "$PR" --body-file body.md
          if [ "$(cat merge.txt)" = "1" ]; then
            gh pr merge "$PR" --squash || gh pr merge "$PR" --squash --admin
            # stamp when the new entry landed, so the record timeline survives
            # the shallow clones the deploy hosts use
            git reset --hard            # drop the overlaid PR files first
            git fetch origin main
            git checkout -B main origin/main
            node scripts/landed.mjs
            if ! git diff --quiet -- data/landed.json; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -q -m "chore: stamp when $HANDLE landed" -- data/landed.json
              git push origin main
            fi
          fi
