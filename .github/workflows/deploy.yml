name: deploy
on:
  push:
    branches: [main]

# Redeploy the live site when the leaderboard changes. Needs a RAILWAY_TOKEN
# repo secret (Railway → project → Settings → Tokens). If you instead connect
# the repo in the Railway dashboard (Settings → Source), delete this file —
# Railway will auto-deploy on push and you won't need the token.
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then echo "No RAILWAY_TOKEN secret — skipping (connect the repo in Railway instead)."; exit 0; fi
          npm i -g @railway/cli
          railway up --service web --detach
